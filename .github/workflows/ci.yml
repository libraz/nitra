name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The inpainting crate is compiled, not committed, so every target below
      # that touches `assets` needs the wasm toolchain rather than just Bun.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/heal

      # The models are pinned by URL and by digest in the fetch script, so that
      # script's own contents are the cache key: a new model revision is a new
      # key, and a cache hit can only be the exact bytes the build asked for.
      - uses: actions/cache@v6
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.ts') }}

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # Cloudflare's build image carries no Rust toolchain, and the inpainting
  # module is compiled rather than committed, so the site cannot be built there.
  # It is built here instead and the finished directory is uploaded — which also
  # means the bytes that go live are the ones the job above tested, not a second
  # build of the same commit.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nitra --branch=main
