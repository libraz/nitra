name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The models are pinned by URL and by digest in the fetch script, so that
      # script's own contents are the cache key: a new model revision is a new
      # key, and a cache hit can only be the exact bytes the build asked for.
      - uses: actions/cache@v6
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.ts') }}

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # The finished directory is uploaded rather than rebuilt where it is served,
  # so the bytes that go live are the ones the job above tested rather than a
  # second build of the same commit.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nitra --branch=main
