name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The models are pinned by URL and by digest in the fetch script, so that
      # script's own contents are the cache key: a new model revision is a new
      # key, and a cache hit can only be the exact bytes the build asked for.
      - uses: actions/cache@v6
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.ts') }}

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Built here to be checked, not to be shipped: what goes live is built
      # where it is served. A bundling failure is one the other targets cannot
      # see, so it is worth a step of its own.
      - name: Build
        run: bun run build
